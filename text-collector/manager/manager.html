<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网页文字采集器</title>
<link rel="stylesheet" href="manager.css">
</head>
<body>

<div id="app">
  <!-- 顶部工具栏 -->
  <header class="toolbar">
    <div class="toolbar-left">
      <button id="btn-import" class="btn btn-secondary" title="从 JSON 文件导入记录">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1v10m0 0l4-4m-4 4l-4-4M1 13h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        导入
      </button>
      <div class="dropdown">
        <button id="btn-export" class="btn btn-secondary" title="导出记录">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 11V1m0 0l4 4m-4-4l-4 4M1 13h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="matrix(1 0 0 -1 0 14)"/></svg>
          导出
          <span class="dropdown-arrow">▾</span>
        </button>
        <div id="export-menu" class="dropdown-menu hidden">
          <button data-format="txt">导出为 TXT</button>
          <button data-format="json">导出为 JSON</button>
        </div>
      </div>
      <button id="btn-clear" class="btn btn-danger" title="清空所有记录">清空全部</button>
    </div>
    <div class="toolbar-right">
      <span id="record-count" class="record-info">共 0 条 · 占用约 0 KB</span>
      <div class="toggle-switch" id="collect-toggle">
        <span class="toggle-label">采集</span>
        <div class="toggle-track">
          <div class="toggle-thumb"></div>
        </div>
        <span class="toggle-state">开</span>
      </div>
    </div>
  </header>

  <!-- 存储警告 -->
  <div id="storage-warning" class="warning-bar hidden">
    ⚠ 记录数已超过 5000 条，建议导出备份
  </div>

  <!-- 新记录提示 -->
  <div id="new-records-hint" class="new-records-hint hidden"></div>

  <!-- 记录列表 -->
  <main id="list" class="list">
    <!-- 记录卡片动态插入 -->
  </main>

  <!-- 空状态 -->
  <div id="empty-state" class="empty-state hidden">
    <div class="empty-icon">📝</div>
    <p>还没有采集记录，去网页上选中文字试试吧</p>
  </div>

  <!-- 加载更多 -->
  <div id="load-more" class="load-more hidden">
    <button class="btn btn-ghost" id="btn-load-more">加载更多</button>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container"></div>
</div>

<!-- 隐藏的文件输入用于导入 -->
<input type="file" id="file-input" accept=".json" style="display:none">

<script src="../utils/storage.js"></script>
<script src="manager.js"></script>
</body>
</html>
