<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网页文字采集器</title>
<link rel="stylesheet" href="manager.css">
</head>
<body>

<div id="app">
  <!-- 顶部工具栏 -->
  <header class="toolbar">
    <div class="toolbar-left">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="0" y="0" width="24" height="24" rx="5.2" fill="#2f6fed"/>
          <g fill="#ffffff">
            <path transform="translate(2.25 7.31) scale(0.0862)" d="M 40 6 L 74 6 L 50 94 L 0 94 Z"/>
            <path transform="translate(13.13 7.31) scale(0.0862)" d="M 40 6 L 74 6 L 50 94 L 0 94 Z"/>
          </g>
        </svg>
        <span class="brand-name">采集器<span class="brand-sep">/</span><span class="brand-sub">manager</span></span>
        <span id="toolbar-count" class="toolbar-count" aria-live="polite"></span>
      </div>
      <div class="dropdown">
        <button id="btn-export" class="btn" title="导出记录"
                aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 11V1m0 0l4 4m-4-4l-4 4M1 13h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="matrix(1 0 0 -1 0 14)"/></svg>
          导出
          <span class="dropdown-arrow">▾</span>
        </button>
        <div id="export-menu" class="dropdown-menu hidden" role="menu" aria-label="导出格式">
          <button data-format="txt" role="menuitem">导出为 TXT</button>
          <button data-format="json" role="menuitem">导出为 JSON</button>
        </div>
      </div>
      <button id="btn-clear" class="btn btn-danger" title="清空所有记录">清空全部</button>
    </div>
    <div class="toolbar-right">
      <div class="toggle" id="collect-toggle" role="switch" aria-checked="true" tabindex="0" aria-label="采集开关">
        <span class="toggle-label">采集</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
        <span class="toggle-state" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <!-- 页面标题 -->
  <div class="page-head">
    <div class="page-head-top">
      <h1 class="page-title">Collected snippets</h1>
      <nav class="tab-nav" role="tablist" aria-label="笔记分类导航">
        <button id="tab-home" class="tab-btn active" role="tab" aria-selected="true" aria-controls="list" data-tab="home">首页</button>
        <button id="tab-saved" class="tab-btn" role="tab" aria-selected="false" aria-controls="list" data-tab="saved">已保存</button>
      </nav>
    </div>
    <p class="page-sub" id="page-sub">共 0 条 <span class="sep">/</span> 占用约 0 KB <span class="sep">/</span> 最新在前</p>
  </div>

  <!-- 存储警告 -->
  <div id="storage-warning" class="warning-bar hidden">
    记录数已超过 5000 条，建议导出备份
  </div>

  <!-- 新记录提示 -->
  <div id="new-records-hint" class="new-records-hint hidden"></div>

  <!-- 记录列表 -->
  <main id="list" class="list" aria-label="采集记录列表">
    <!-- 记录卡片动态插入 -->
  </main>

  <!-- 空状态 -->
  <div id="empty-state" class="empty-state hidden">
    <svg class="empty-icon" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="2" y="2" width="44" height="44" rx="10" fill="#eaf1ff"/>
      <g fill="#a9c3f6">
        <path transform="translate(4.5 14.63) scale(0.1725)" d="M 40 6 L 74 6 L 50 94 L 0 94 Z"/>
        <path transform="translate(26.25 14.63) scale(0.1725)" d="M 40 6 L 74 6 L 50 94 L 0 94 Z"/>
      </g>
    </svg>
    <p class="empty-title" id="empty-title">还没有采集记录</p>
    <p class="empty-sub" id="empty-sub">去任意网页上选中一段文字，500ms 后会自动保存到这里。</p>
  </div>

  <!-- 加载更多 -->
  <div id="load-more" class="load-more hidden">
    <button class="btn btn-load-more" id="btn-load-more">加载更多</button>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container" aria-live="polite"></div>
</div>

<script src="../utils/storage.js"></script>
<script src="toast.js"></script>
<script src="modal.js"></script>
<script src="render.js"></script>
<script src="export.js"></script>
<script src="manager.js"></script>
</body>
</html>
