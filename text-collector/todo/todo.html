<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办 - 采集器</title>
<link rel="stylesheet" href="todo.css">
</head>
<body>

<div id="app">
  <!-- 顶部工具栏 -->
  <header class="toolbar">
    <div class="toolbar-left">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="0" y="0" width="24" height="24" rx="5.2" fill="#2f6fed"/>
          <g fill="#ffffff">
            <path transform="translate(2.25 7.31) scale(0.0862)" d="M 40 6 L 74 6 L 50 94 L 0 94 Z"/>
            <path transform="translate(13.13 7.31) scale(0.0862)" d="M 40 6 L 74 6 L 50 94 L 0 94 Z"/>
          </g>
        </svg>
        <span class="brand-name">采集器<span class="brand-sep">/</span><a href="../manager/manager.html" class="brand-sub">待办</a></span>
      </div>
      <!-- 网站导航 -->
      <div class="nav hidden" id="nav-root">
        <button id="btn-nav" class="btn btn-nav" aria-label="网站导航"
                aria-haspopup="true" aria-expanded="false" aria-controls="nav-panel">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.4"/>
            <path d="M10.9 5.1L9.5 9.5L5.1 10.9L6.5 6.5Z" fill="currentColor"/>
          </svg>
        </button>
        <nav id="nav-panel" class="nav-panel hidden" aria-label="网站快捷方式"></nav>
      </div>
    </div>
    <div class="toolbar-right">
      <div class="toggle" id="collect-toggle" role="switch" aria-checked="true" tabindex="0" aria-label="采集开关">
        <span class="toggle-label">采集</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
        <span class="toggle-state" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <div class="main-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <h2 class="sidebar-title">我的清单</h2>
        <div class="list-container" id="list-container">
          <!-- 清单列表动态插入 -->
        </div>
        <button class="btn btn-new-list" id="btn-new-list">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          新建清单
        </button>
      </div>
      
      <div class="sidebar-divider"></div>
      
      <nav class="sidebar-nav" aria-label="快捷视图">
        <button class="nav-item" id="nav-all" data-view="all">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          <span>全部待办</span>
          <span class="nav-badge" id="badge-all"></span>
        </button>
        <button class="nav-item" id="nav-done" data-view="done">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/>
            <path d="M5.5 8l2 2 3-3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>已完成</span>
          <span class="nav-badge" id="badge-done"></span>
        </button>
      </nav>
      
      <div class="sidebar-divider"></div>
      
      <button class="nav-item" id="nav-templates" data-view="templates">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="2" y="1" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.3"/>
          <path d="M5 5h6M5 8h6M5 11h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span>模板库</span>
        <span class="nav-badge" id="badge-templates"></span>
      </button>
    </aside>

    <!-- 内容区 -->
    <main class="content" id="content">
      <!-- 动态内容 -->
    </main>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container" aria-live="polite"></div>
</div>

<!-- 确认弹窗模板 -->
<template id="modal-confirm-template">
  <div class="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 class="modal-title"></h3>
      <p class="modal-body"></p>
      <div class="modal-actions">
        <button class="btn btn-cancel"></button>
        <button class="btn btn-confirm"></button>
      </div>
    </div>
  </div>
</template>

<script src="../utils/storage.js"></script>
<script src="../utils/todo-storage.js"></script>
<script src="../manager/toast.js"></script>
<script src="../manager/nav.js"></script>
<script src="todo.js"></script>
</body>
</html>
